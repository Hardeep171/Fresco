services:
  # -------------------------------------------------------------
  # FRESCO Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: fresco-backend
    env: node
    plan: free
    rootDir: fresco-backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: CORS_ORIGIN
        sync: false

  # -------------------------------------------------------------
  # FRESCO Web Platform (Static Site)
  # -------------------------------------------------------------
  - type: web
    name: fresco-web
    env: static
    plan: free
    rootDir: fresco-web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
